<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eulr</title>
<style>
  html, body { margin: 0; }
  body {
    background: #101010;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  /* winit owns the canvas sizing; just make it a block element */
  #eulr-canvas-container canvas { display: block; }
  #loading { color: #847c9c; font-size: 13px; letter-spacing: .09em; padding: 16px; }
</style>
</head>
<body>
<div id="eulr-canvas-container"><div id="loading">compiling fluid&#8230;</div></div>
<script>
  new MutationObserver(function (mutations, obs) {
    if (document.querySelector('#eulr-canvas-container canvas')) {
      var l = document.getElementById('loading');
      if (l) { l.remove(); }
      obs.disconnect();
    }
  }).observe(document.getElementById('eulr-canvas-container'), { childList: true });
</script>
<script type="module">
  import init from './eulr.js';
  init().catch(function (e) {
    var l = document.getElementById('loading');
    if (l) { l.textContent = 'failed to start: ' + e; }
  });
</script>
</body>
</html>
