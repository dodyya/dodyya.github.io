<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ch8</title>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background: #101010;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  #ch8-canvas-container {
    width: 100%; height: 100%;
    display: grid;
    place-items: center;
  }
  /* winit sets inline width/height on the canvas; override it */
  #ch8-canvas-container canvas {
    display: block !important;
    width: 100% !important;
    height: 100% !important;
    object-fit: contain;
    image-rendering: pixelated;
  }
  #loading { color: #847c9c; font-size: 13px; letter-spacing: .09em; }
</style>
</head>
<body>
<div id="ch8-canvas-container"><div id="loading">loading rom&#8230;</div></div>
<script>
  new MutationObserver(function (mutations, obs) {
    if (document.querySelector('#ch8-canvas-container canvas')) {
      var l = document.getElementById('loading');
      if (l) { l.remove(); }
      obs.disconnect();
    }
  }).observe(document.getElementById('ch8-canvas-container'), { childList: true });
</script>
<script type="module">
  import init from './ch8.js';
  init().catch(function (e) {
    var l = document.getElementById('loading');
    if (l) { l.textContent = 'failed to start: ' + e; }
  });
</script>
</body>
</html>
