<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wavz</title>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background: #0e0c14;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  /* winit 0.29's web backend takes the canvas's CSS size as the source of
     truth (it observes it and sizes the drawing buffer to match). The canvas
     must therefore be CSS-sized: without this the canvas size and its backing
     store feed back into each other and run away. 100% fills the iframe. */
  #wavz-canvas-container, #wavz-canvas-container canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  #loading { color: #847c9c; font-size: 13px; letter-spacing: .09em; padding: 16px; }
</style>
</head>
<body>
<div id="wavz-canvas-container"><div id="loading">computing fft&#8230;</div></div>
<script>
  new MutationObserver(function (mutations, obs) {
    if (document.querySelector('#wavz-canvas-container canvas')) {
      var l = document.getElementById('loading');
      if (l) { l.remove(); }
      obs.disconnect();
    }
  }).observe(document.getElementById('wavz-canvas-container'), { childList: true });
</script>
<script type="module">
  import init from './wavz.js';
  init().catch(function (e) {
    var l = document.getElementById('loading');
    if (l) { l.textContent = 'failed to start: ' + e; }
  });
</script>
</body>
</html>
